version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # The dev copy of emdash stays on the peer floor 1.4.0 that CI checks; raise it by hand with the peer range.
    ignore:
      - dependency-name: emdash
    groups:
      # Minor and patch updates in one weekly pull request; each major gets its own.
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
